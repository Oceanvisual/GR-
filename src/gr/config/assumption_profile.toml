# Default economic assumptions (FR-052, data-model.md §5, T043).
#
# Every value here is [Предположение]: a placeholder to be replaced with the organisation's
# data. Generated assumptions carry the source `default_profile`, and the UI marks them
# «Модельное допущение (не подтверждено)». The LLM never produces these numbers: it gives
# levels (reduction potential, integration complexity), and the tables below turn them into
# numbers.
#
# Scenarios: the conservative and optimistic values are the base value times the multipliers
# in [spread] — less volume and reduction, more review time and cost in the conservative one.
# Shares are capped at 1. A parameter without a spread is the same in all three scenarios.

currency = "₽"

hourly_cost = 1200        # ₽ per hour
overhead_ratio = 0.3      # share added to the hourly cost
fte_hours_per_year = 1970 # working hours of one FTE per year
horizon_years = 3         # 1–3, one value in all scenarios
volume_per_year = 1000    # cases per year; a stub: always requires_input
case_share = 1.0          # after a decision point: requires_input, branch odds are not invented
fixed_opex_share = 0.2    # fixed_opex_per_year = share × capex
adoption = [0.5, 0.9, 1.0] # adoption share in years 1, 2, 3

[time_hours] # hours per execution, by operation type
intake = 0.25
registration = 0.1
completeness_check = 0.5
data_verification = 1.0
interagency_request = 0.5
document_preparation = 2.0
approval = 0.5
decision = 0.5
signing = 0.1
notification = 0.25
issuance = 0.25
record_keeping = 0.1
control = 1.0
other = 0.5

[reduction_share] # share of the operation time removed, by the level S6 gave
very_low = 0.05
low = 0.15
medium = 0.35
high = 0.6
very_high = 0.8

[review_share] # review_hours = share × time_hours of the operation, by solution category
classic_automation = 0
ai_nlp = 0.15
hybrid = 0.2
llm_rag = 0.25
ai_agent = 0.3

[capex] # ₽, by solution category, times the integration multiplier
classic_automation = 1_500_000
ai_nlp = 3_000_000
hybrid = 4_000_000
llm_rag = 4_000_000
ai_agent = 6_000_000

[integration_multiplier] # by the integration complexity S6 gave
very_low = 0.5
low = 0.8    # data-model gives only the ends (0.5 … 2.2): low, medium, high are [Предположение]
medium = 1.0
high = 1.5
very_high = 2.2

[variable_cost_per_exec] # ₽ per execution (API calls and the like), by solution category
classic_automation = 0
ai_nlp = 0.5
hybrid = 2
llm_rag = 5
ai_agent = 15

[spread] # [conservative, optimistic] multipliers of the base value
volume_per_year = [0.7, 1.3]
time_hours = [0.8, 1.2]
reduction_share = [0.6, 1.2]
review_hours = [1.5, 0.7]
capex = [1.4, 0.8]
fixed_opex_per_year = [1.3, 0.8]
variable_cost_per_exec = [1.5, 0.7]
adoption = [0.6, 1.2]
