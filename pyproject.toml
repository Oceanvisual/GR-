[project]
name = "gr"
version = "0.1.0"
description = "AI-анализ НПА: административные процессы, возможности автоматизации, экономика, приоритизация"
readme = "README.md"
authors = [
    { name = "Misha", email = "nmska2.0@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "charset-normalizer>=3.5.2",
    "fastapi>=0.156.8",
    "jinja2>=3.1.6",
    "openai>=3.35.1",
    "pydantic-settings>=2.16.1",
    "pypdfium2>=5.14.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "selectolax>=1.0.1",
    "sqlalchemy[asyncio]>=2.1.5",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
gr = "gr.__main__:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".specify"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# UI, error messages and domain texts are in Russian: Cyrillic is intentional, not a confusable.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Pydantic copies field defaults per instance; ruff only knows direct BaseModel subclasses.
"src/gr/domain/*.py" = ["RUF012"]
"src/gr/extraction/schemas.py" = ["RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: performance checks (SC-001, SC-005)",
    "ocr: requires the tesseract binary with the rus language pack",
    "soffice: requires LibreOffice (soffice) for DOC/RTF/ODT conversion",
]
